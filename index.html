<!DOCTYPE html>
<html>
<head>
    <title>Ledger Mind - AI Bookkeeper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-gray-800 p-8 rounded-2xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center mb-2">🧾 Ledger Mind</h1>
        <p class="text-center text-gray-400 mb-6">AI Bookkeeper Agent - Fraud detection & Tax deduction</p>

        <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center mb-6">
            <input type="file" id="pdfFile" accept=".pdf" class="hidden">
            <button onclick="document.getElementById('pdfFile').click()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold">
                Upload Bank Statement PDF
            </button>
            <p id="fileName" class="mt-3 text-sm text-gray-400"></p>
        </div>

        <button id="scanBtn" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-bold text-lg">
            Scan with AI
        </button>

        <div id="result" class="mt-6 hidden">
            <h2 class="text-xl font-bold mb-3">Extracted Transactions:</h2>
            <div id="tableData" class="bg-gray-900 p-4 rounded-lg overflow-auto text-sm"></div>
        </div>

        <p id="status" class="mt-4 text-center text-yellow-400"></p>
    </div>

<script>
const fileInput = document.getElementById('pdfFile');
const fileName = document.getElementById('fileName');
const scanBtn = document.getElementById('scanBtn');
const status = document.getElementById('status');
const resultDiv = document.getElementById('result');
const tableData = document.getElementById('tableData');

fileInput.onchange = () => {
    fileName.textContent = fileInput.files[0].name;
}

scanBtn.onclick = async () => {
    if (!fileInput.files[0]) {
        alert("Please upload a PDF first bro!");
        return;
    }
    status.textContent = "⏳ Scanning... Please wait 10-20 seconds (backend is waking up)";
    resultDiv.classList.add('hidden');

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {
        const res = await fetch('https://ledger-mind-api.onrender.com/scan', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        status.textContent = "✅ Done!";
        resultDiv.classList.remove('hidden');
        tableData.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    } catch (err) {
        status.textContent = "❌ Error: " + err.message + " - Backend may be sleeping, try again in 30 sec";
    }
}
</script>
</body>
</html>
